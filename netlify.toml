[build]
  command = "node scripts/build.js"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]
  included_files = ["blog/lib/**", "blog/public/**", "blog/server.js"]

# Dynamic routes go to the single blog function; static files are served from dist/.
[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/_blog/admin.js"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/_blog/admin.css"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/_blog/markdown.js"
  to = "/.netlify/functions/web"
  status = 200
  force = true

[[redirects]]
  from = "/_blog/blog.js"
  to = "/.netlify/functions/web"
  status = 200
  force = true
